<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 flex justify-center">
    <div class="max-w-md w-full bg-white p-6 rounded-xl shadow-md border border-slate-200">
        <h3 class="text-lg font-bold mb-1">🎤 English Pronunciation Lab</h3>
        <p id="counter" class="text-sm text-slate-500 mb-1">Frase 1 de 8</p>
        
        <!-- Dica em Português -->
        <div id="hint-display" class="text-xs text-slate-500 mb-4 italic font-medium">
            💡 Dica: Ele está considerando se aposentar mais cedo.
        </div>
        
        <div id="sentence-display" class="p-4 bg-indigo-50 border-l-4 border-indigo-600 rounded mb-4 font-medium text-indigo-900 text-lg">
            "He's considering taking early retirement."
        </div>

        <div class="flex gap-2 mb-2">
            <button id="listen-btn" class="flex-1 bg-slate-200 text-slate-700 py-2 rounded-lg font-bold hover:bg-slate-300 transition">Ouvir Frase (IA)</button>
            <button id="start-btn" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 transition">Começar</button>
        </div>

        <!-- Player para o aluno se ouvir -->
        <div id="audio-container" class="mb-4 hidden">
            <p class="text-xs text-slate-500 mb-1 font-medium">🎧 Ouça sua gravação:</p>
            <audio id="user-audio" controls class="w-full"></audio>
        </div>

        <div class="flex gap-2 mb-4">
            <button id="skip-btn" class="flex-1 bg-slate-100 text-slate-600 py-2 rounded-lg font-bold hover:bg-slate-200 transition">Pular Frase →</button>
            <button id="next-btn" class="hidden flex-1 bg-emerald-600 text-white py-2 rounded-lg font-bold hover:bg-emerald-700 transition">Próxima Frase →</button>
        </div>

        <div id="feedback" class="mt-4 p-3 rounded text-sm hidden font-medium"></div>
    </div>

    <script>
        const sentences = [
            "He's considering taking early retirement.",
            "He is being very noisy right now.",
            "The train leaves at 8:30 PM tonight.",
            "You are always interrupting me during meetings.",
            "I apologize for being late to the meeting.",
            "We have a nice room in the hotel.",
            "Adams makes a wonderful return. She is playing magnificent tennis in this match.",
            "The population of the world is rising very fast."
        ];

        const hints = [
            "💡 Dica: Ele está considerando se aposentar mais cedo.",
            "💡 Dica: Ele está fazendo muito barulho agora mesmo.",
            "💡 Dica: O trem parte às 8:30 da noite de hoje.",
            "💡 Dica: Você está sempre me interrompendo durante as reuniões.",
            "💡 Dica: Peço desculpas por estar atrasado para a reunião.",
            "💡 Dica: Nós temos um quarto legal no hotel.",
            "💡 Dica: Adams faz um retorno maravilhoso. Ela está jogando um tênis magnífico nesta partida.",
            "💡 Dica: A população mundial está crescendo muito rápido."
        ];
        
        let currentIndex = 0;
        let isListening = false;
        let mediaRecorder;
        let audioChunks = [];
        
        const display = document.getElementById('sentence-display');
        const hintDisplay = document.getElementById('hint-display');
        const startBtn = document.getElementById('start-btn');
        const listenBtn = document.getElementById('listen-btn');
        const nextBtn = document.getElementById('next-btn');
        const skipBtn = document.getElementById('skip-btn');
        const feedback = document.getElementById('feedback');
        const counter = document.getElementById('counter');
        const audioContainer = document.getElementById('audio-container');
        const userAudio = document.getElementById('user-audio');
        
        function normalize(text) {
            return text.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; // Configurado para inglês dos EUA
        recognition.continuous = false;

        function updateUI() {
            display.innerText = '"' + sentences[currentIndex] + '"';
            hintDisplay.innerText = hints[currentIndex];
            counter.innerText = "Frase " + (currentIndex + 1) + " de " + sentences.length;
            feedback.classList.add('hidden');
            nextBtn.classList.add('hidden');
            audioContainer.classList.add('hidden');
        }

        listenBtn.onclick = () => {
            const utterance = new SpeechSynthesisUtterance(sentences[currentIndex]);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        };

        // Configuração de Gravação de Áudio do Aluno
        async function setupRecorder() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    userAudio.src = audioUrl;
                    audioContainer.classList.remove('hidden');
                };
            } catch (err) {
                console.log("Microphone access denied or not supported", err);
            }
        }
        setupRecorder();

        startBtn.onclick = () => {
            if (!isListening) {
                isListening = true;
                startBtn.innerText = "Parar";
                startBtn.className = "flex-1 bg-red-600 text-white py-2 rounded-lg font-bold hover:bg-red-700 transition";
                feedback.innerText = "Ouvindo e gravando...";
                feedback.className = "mt-4 p-3 rounded text-sm text-center bg-yellow-100 text-yellow-800";
                feedback.classList.remove('hidden');
                
                audioChunks = [];
                if (mediaRecorder && mediaRecorder.state === "inactive") {
                    mediaRecorder.start();
                }
                
                recognition.start();
            } else {
                recognition.stop();
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            }
        };

        recognition.onend = () => {
            isListening = false;
            startBtn.innerText = "Começar";
            startBtn.className = "flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 transition";
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            const normTranscript = normalize(transcript);
            const normTarget = normalize(sentences[currentIndex]);
            
            if (normTranscript === normTarget) {
                feedback.className = "mt-4 p-3 rounded text-sm text-center bg-green-100 text-green-800";
                feedback.innerText = "✅ Excellent! Perfect pronunciation and linking sounds!";
                nextBtn.classList.remove('hidden');
            } else {
                feedback.className = "mt-4 p-3 rounded text-sm text-left bg-red-100 text-red-800";
                feedback.innerHTML = `❌ <strong>You said:</strong> '${transcript}'.<br><br>⚠️ <strong>Pronunciation & Linking Tip:</strong> Pay attention to natural word blending (linking sounds), sentence stress, and vowel sounds. Listen to the AI audio and your own recording above to compare, then try again or click 'Pular Frase'.`;
                nextBtn.classList.remove('hidden');
            }
        };

        skipBtn.onclick = nextBtn.onclick = () => {
            currentIndex++;
            if (currentIndex < sentences.length) {
                updateUI();
            } else {
                display.innerText = "Parabéns! Você completou todas as frases.";
                hintDisplay.innerText = "🎉 Prática finalizada com sucesso!";
                document.querySelector('.flex.gap-2.mb-2').classList.add('hidden');
                document.querySelector('.flex.gap-2.mb-4').classList.add('hidden');
                feedback.classList.add('hidden');
                audioContainer.classList.add('hidden');
                counter.innerText = "Concluído";
            }
        };
    </script>
</body>
</html>
